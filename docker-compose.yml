services:
  # ===== AI桌宠后端（FastAPI + LangGraph）=====
  # 本机为 fake-ip 透明代理网络，bridge 容器 DNS 不可用：
  # app 容器走 host 网络，出网走宿主机代理，经宿主机端口访问 pg/milvus（.env 用 localhost）
  app:
    build:
      context: .
      network: host
    network_mode: host
    volumes:
      - ./.env:/app/.env:ro
      - app_temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped

  # ===== PostgreSQL：LangGraph 持久化记忆（checkpointer）=====
  postgres:
    image: postgres:16-alpine
    container_name: tablepet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: langgraph
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ===== Milvus standalone（RAG 向量库）=====
  # 官方 standalone 拓扑：milvus + etcd(元数据) + minio(对象存储)
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: tablepet-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: tablepet-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.17
    container_name: tablepet-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  etcd_data:
  minio_data:
  milvus_data:
  app_temp:
